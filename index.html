<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed {
            text-decoration: line-through;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- a. Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-tasks"></i> Todo List App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">À propos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- b. Formulaire d'ajout de tâche -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0"> Ajouter une nouvelle tâche</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST" class="d-flex gap-2">
                            <input type="hidden" name="action" value="new">
                            <input type="text" 
                                   name="title" 
                                   class="form-control" 
                                   placeholder="Que souhaitez-vous faire ?" 
                                   required>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- c. Liste des tâches -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0" Mes tâches </h5>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush">
                            <!-- Exemple de tâches statiques pour le design -->
                            <li class="list-group-item list-group-item-success">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="completed">
                                        Arroser les plantes
                                    </span>
                                    <form method="POST" class="d-inline">
                                        <input type="hidden" name="id" value="1">
                                        <div class="btn-group btn-group-sm gap-2">
                                            <button type="submit" name="action" value="toggle" class="btn btn-warning">
                                                Annuler
                                            </button>
                                            <button type="submit" name="action" value="delete" class="btn btn-danger">
                                                Supprimer
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <small class="text-muted">Créé le : 15/11/2023 10:30</small>
                            </li>
                            
                            <li class="list-group-item list-group-item-warning">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>
                                        Terminer l'activité 7 du module Approche agile
                                    </span>
                                    <form method="POST" class="d-inline">
                                        <input type="hidden" name="id" value="2">
                                        <div class="btn-group btn-group-sm gap-2">
                                            <button type="submit" name="action" value="toggle" class="btn btn-success">
                                                Done
                                            </button>
                                            <button type="submit" name="action" value="delete" class="btn btn-danger">
                                                Supprimer
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <small class="text-muted">Créé le : 14/11/2023 16:45</small>
                            </li>
                            
                            <li class="list-group-item list-group-item-warning">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>
                                        Acheter le riz et du lait
                                    </span>
                                    <form method="POST" class="d-inline">
                                        <input type="hidden" name="id" value="3">
                                        <div class="btn-group btn-group-sm gap-2">
                                            <button type="submit" name="action" value="toggle" class="btn btn-success">
                                                Done
                                            </button>
                                            <button type="submit" name="action" value="delete" class="btn btn-danger">
                                                Supprimer
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <small class="text-muted">Créé le : 14/11/2023 09:15</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome pour les icônes -->
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
